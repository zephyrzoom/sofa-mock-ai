server:
  port: 8090

spring:
  datasource:
    url: jdbc:h2:file:./data/mock-agent-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mock:
  server:
    auth:
      enabled: false
      token: changeme
